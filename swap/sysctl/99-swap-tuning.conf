# Managed by swap-setup.sh (CST): VM tunables for zswap + NVMe swap.
# Rationale: with zswap most swap-ins come back from the compressed pool in
# RAM (microseconds), so swapping cold anonymous pages is usually cheaper than
# dropping page cache that must be re-read from disk. Hence a bias toward
# swap, but not the 180 used when ALL swap lived in RAM: pages the shrinker
# pushes to NVMe are genuinely expensive to bring back.

# 100 = treat swap-in and file re-read as equally costly. Lower to 60 if
# disk swap-ins (`cst swap status`: pswpin, "read back") grow.
vm.swappiness = 100

# Read 1 page per swap fault (2^0). Readahead only benefits rotational
# disks; on zswap/NVMe it just adds latency.
vm.page-cluster = 0

# Don't boost watermarks after memory fragmentation events; avoids
# unnecessary kswapd reclaim bursts.
vm.watermark_boost_factor = 0

# Wake background reclaim earlier (1.25% of memory between watermarks)
# so reclaim happens smoothly instead of in stalls under pressure.
vm.watermark_scale_factor = 125
