# Managed by swap-setup.sh (CST): uresourced memory floor for the active session.
# Protects user.slice -> user-<uid>.slice -> user@<uid>.service -> session.slice
# with a hard MemoryMin=1G floor (capped at 10% of RAM by [Global] MaxMemoryMin
# on smaller hosts). MemoryLow is left unset so cpu/game-profile owns it.

[Global]
MaxMemoryMin=10%

[ActiveUser]
MemoryMin=1G
IOWeight=500
CPUWeight=500

[SessionSlice]

[AppBoost]
ActiveCPUWeight=300
ActiveIOWeight=300
BoostCPUWeightInc=200
BoostIOWeightInc=200
