# SPDX-License-Identifier: MPL-2.0
# Managed by swap-setup.sh (CST): kernel memory reclaim responsiveness knobs.
# Written via tmpfiles.d so sysfs settings persist across reboots; see swap/README.md in CST.

# defer+madvise avoids synchronous compaction pauses on MADV_HUGEPAGE faults
# while still waking kcompactd in the background.
w /sys/kernel/mm/transparent_hugepage/defrag - - - - defer+madvise

# 1000 ms MGLRU working-set floor prevents bursts from immediately evicting
# hot desktop and cache pages right after they are faulted in.
w /sys/kernel/mm/lru_gen/min_ttl_ms          - - - - 1000
