# Managed by btrfs-setup.sh (CST): disable deep NVMe APST sleep pauses on desktop power.
# w-: a write the kernel refuses (read-only sysfs in a container, a value a controller rejects) does not fail
# systemd-tmpfiles-setup at boot; 65-cst-nvme-apst.rules and install set the values too.
w- /sys/module/nvme_core/parameters/default_ps_max_latency_us - - - - 0
w- /sys/class/nvme/nvme*/power/pm_qos_latency_tolerance_us    - - - - 0
