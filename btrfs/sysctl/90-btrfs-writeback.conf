# Managed by btrfs-setup.sh (CST).
#
# The tuned `throughput-performance` profile sets vm.dirty_ratio=40, which on
# a 96 GiB machine lets ~37 GiB of dirty pages pile up. With `flushoncommit`
# every btrfs transaction commit must flush all of it (a 4.4 s commit was
# observed). Absolute byte limits cap that at 2 GiB (~0.5 s of NVMe writes)
# without changing how much ends up written. Setting *_bytes zeroes *_ratio;
# tuned has reapply_sysctl=1, so /etc/sysctl.d wins over the tuned profile.
vm.dirty_background_bytes = 536870912
vm.dirty_bytes = 2147483648
