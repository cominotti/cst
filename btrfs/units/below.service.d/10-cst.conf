# Managed by btrfs-setup.sh (CST).
# 7 days of history. Plain --compress measured ~1.8 GB/day here (hundreds of
# processes, many short-lived), so a 4 GiB cap left only ~2 days; dictionary
# compression (16-frame chunks, ~20-30x per below's docs) plus an 8 GiB cap
# (enforced when a new daily shard starts) keeps the full week.
[Service]
ExecStart=
ExecStart=/usr/bin/below record --retain-for-s 604800 --store-size-limit 8589934592 --compress --dict-compress-chunk-size 16
