# Managed by btrfs-setup.sh (CST).
# 7 days of history with 15 s recording cadence (3x fewer writes/fsyncs than
# 5 s; stall episodes still sample at 5 s / 1 s in RAM via btrfs-stall-monitord
# and btrfs-stall-report integrates below samples by timestamp delta).
# Dictionary compression (16-frame chunks) + 8 GiB cap keep the full week.
[Service]
ExecStart=
ExecStart=/usr/bin/below record --interval-s 15 --retain-for-s 604800 --store-size-limit 8589934592 --compress --dict-compress-chunk-size 16
