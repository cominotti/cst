# managed-by: toolchains-setup.sh (CST): the defaults of `cst toolchains`.
# Do not edit them here: put your own values into ~/.config/cst/toolchains.conf
# (same KEY=value lines; yours win). An unknown key or a bad value stops every
# run, so nothing is deleted by a typo. Details: toolchains/README.md.
#
# Keys are <LANG>_<CACHE>_<SETTING>. ENABLED=yes: the hourly timer and a bare
# `cst toolchains prune` run the target; no: only when named on the command line.
# Durations: s, m, h, d or w. Sizes: K, M, G or T (G = GiB); the unit is
# required, only 0 (or off) goes without one.

# rust:build: cargo's intermediate build files in ~/.cache/cargo-build
RUST_BUILD_ENABLED=yes
# Delete a build folder not used for longer than this.
RUST_BUILD_MAX_IDLE=48h
# Then, while all of them together are bigger, delete the least recently used first.
RUST_BUILD_MAX_TOTAL=150G
# Never delete a folder used more recently than this (at least 15m).
RUST_BUILD_MIN_KEEP=2h
# Delete a folder that no workspace claims any more (its worktree was removed):
# every Cargo.toml in the git worktrees under ~/Workspace is asked which folder
# it uses (cargo metadata --offline --no-deps). MIN_KEEP still applies; if the
# search is incomplete, nothing counts as an orphan in that run.
RUST_BUILD_ORPHANS=yes
# In a folder not used for longer than this, delete only cargo's incremental
# folders (<profile>/incremental); the rest stays. 0 or off: never.
RUST_BUILD_INCREMENTAL_IDLE=6h

# python:uv: `uv cache prune` on ~/.cache/uv (only entries uv no longer uses)
PYTHON_UV_ENABLED=yes
# The timer runs it at most once per this (named on the command line it always runs).
PYTHON_UV_INTERVAL=1d

# Not a prune target: lean debug info for dev builds, written by
# `cst toolchains config apply` into ~/.cargo/config.toml only when yes.
# Turning it on makes the next dev build of every workspace compile everything
# once; set it while builds are quiet. `snapshots setup` never turns it on.
RUST_LEAN_DEBUGINFO=no
