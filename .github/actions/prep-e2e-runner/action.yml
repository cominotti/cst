name: Prepare E2E runner
description: Reclaim disk space on ubuntu-24.04, provision host btrfs kernel support when needed, and hydrate GHCR image cache.

inputs:
  needs_btrfs:
    description: Install linux-modules-extra + btrfs-progs and load btrfs/loop kernel modules
    required: false
    default: 'false'
  hydrate_images:
    description: Space-separated list of E2E image suffixes to pull from GHCR (e.g. "systemd nas" or "systemd nas priv")
    required: false
    default: ''
  tag_local:
    description: Tag pulled GHCR cache images as cst-e2e-<name>:local so run.py skips rebuilding
    required: false
    default: 'true'
  ghcr_token:
    description: Optional token for authenticated read pulls from GHCR
    required: false
    default: ''

outputs:
  cache_from:
    description: Comma-separated list of pulled GHCR image references for --cache-from
    value: ${{ steps.hydrate.outputs.cache_from }}

runs:
  using: composite
  steps:
    - name: Reclaim runner disk space and verify Docker
      shell: bash
      run: |
        set -euo pipefail
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
        df -h /
        docker info >/dev/null

    - name: Provision host btrfs kernel module and PSI preflight
      if: inputs.needs_btrfs == 'true'
      shell: bash
      run: |
        set -euo pipefail
        krel="$(uname -r)"
        pkg="linux-modules-extra-${krel}"
        sudo apt-get update
        # The btrfs module must match the running kernel exactly. A generic
        # package (such as linux-modules-extra-azure) can install modules for a
        # different kernel, so a missing package is an error, not a fallback.
        if ! apt-cache show "${pkg}" >/dev/null 2>&1; then
          echo "::error::${pkg} is not available from apt for the running kernel ${krel}; the runner image and the Ubuntu archive are out of step. Re-run later or pin a runner image whose kernel has a matching modules-extra package." >&2
          exit 1
        fi
        if ! sudo apt-get install -y --no-install-recommends "${pkg}" btrfs-progs; then
          echo "::error::Installing ${pkg} and btrfs-progs failed" >&2
          exit 1
        fi
        if ! sudo modprobe btrfs; then
          echo "::error::modprobe btrfs failed on kernel ${krel} even after installing ${pkg}" >&2
          exit 1
        fi
        sudo modprobe loop || true
        if ! grep -qw btrfs /proc/filesystems; then
          echo "::error::btrfs is not listed in /proc/filesystems after modprobe" >&2
          exit 1
        fi
        if [[ ! -e /dev/loop-control ]]; then
          echo "::error::/dev/loop-control is missing; tier 2 needs loop devices" >&2
          exit 1
        fi
        if [[ ! -r /proc/pressure/io ]]; then
          echo "::error::/proc/pressure/io is not readable; tier 2 needs PSI" >&2
          exit 1
        fi

    - name: Hydrate E2E Docker image cache from GHCR
      id: hydrate
      shell: bash
      env:
        REPO_OWNER: ${{ github.repository_owner }}
        GITHUB_ACTOR: ${{ github.actor }}
        IMAGES: ${{ inputs.hydrate_images }}
        TAG_LOCAL: ${{ inputs.tag_local }}
        GHCR_TOKEN: ${{ inputs.ghcr_token }}
      run: |
        set -euo pipefail
        if [[ -z "${IMAGES}" ]]; then
          echo "cache_from=" >> "${GITHUB_OUTPUT}"
          exit 0
        fi
        if [[ -n "${GHCR_TOKEN}" ]]; then
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin >/dev/null 2>&1 || true
        fi
        owner="$(printf '%s' "${REPO_OWNER}" | tr '[:upper:]' '[:lower:]')"
        pulled=()
        for name in ${IMAGES}; do
          ref="ghcr.io/${owner}/cst-e2e-${name}:cache"
          if docker pull "${ref}"; then
            pulled+=("${ref}")
            if [[ "${TAG_LOCAL}" == "true" ]]; then
              docker tag "${ref}" "cst-e2e-${name}:local"
            fi
          else
            echo "::notice::GHCR cache miss for ${ref}; will build locally"
          fi
        done
        IFS=,
        echo "cache_from=${pulled[*]:-}" >> "${GITHUB_OUTPUT}"
