name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      force_e2e:
        description: Force running both E2E tiers regardless of changed paths
        type: boolean
        required: false
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Classify Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      e2e_images: ${{ steps.filter.outputs.e2e_images }}
    steps:
      - name: Checkout repository
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine affected scope
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          FORCE_E2E: ${{ inputs.force_e2e || false }}
        run: |
          set -euo pipefail
          if [[ "${FORCE_E2E}" == "true" ]]; then
            echo "code=true" >> "${GITHUB_OUTPUT}"
            echo "e2e_images=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          e2e_images="false"
          if [[ "${EVENT_NAME}" == "push" ]]; then
            code="true"
            if [[ -n "${BEFORE_SHA}" && "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              mapfile -t changed < <(git diff --name-only "${BEFORE_SHA}..${AFTER_SHA}")
              for path in "${changed[@]}"; do
                case "${path}" in
                  tests/e2e/images/*|tests/e2e/scripts/*) e2e_images="true" ;;
                esac
              done
            else
              e2e_images="true"
            fi
            echo "code=${code}" >> "${GITHUB_OUTPUT}"
            echo "e2e_images=${e2e_images}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            echo "code=true" >> "${GITHUB_OUTPUT}"
            echo "e2e_images=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          mapfile -t changed < <(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")
          if [[ "${#changed[@]}" -eq 0 ]]; then
            echo "code=false" >> "${GITHUB_OUTPUT}"
            echo "e2e_images=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          code="false"
          for path in "${changed[@]}"; do
            case "${path}" in
              tests/e2e/images/*|tests/e2e/scripts/*) e2e_images="true" ;;
            esac
            case "${path}" in
              *.md|LICENSE|.gitignore) ;;
              *) code="true" ;;
            esac
          done

          echo "code=${code}" >> "${GITHUB_OUTPUT}"
          echo "e2e_images=${e2e_images}" >> "${GITHUB_OUTPUT}"

  fast-gates:
    name: Fast Gates (Fedora 45)
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora:45
    timeout-minutes: 10
    steps:
      - name: Install Fedora 45 fast-gate tools and create non-root CI user
        run: |
          set -euo pipefail
          # gettext-envsubst provides envsubst, needed by sigstore/cosign-installer inside setup-invowk.
          dnf -y install --setopt=install_weak_deps=False git-core python3 ShellCheck curl tar gzip findutils util-linux diffutils gettext-envsubst
          id -u ci >/dev/null 2>&1 || useradd -m -s /bin/bash ci

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup invowk
        uses: ./.github/actions/setup-invowk

      - name: Validate invowk module
        run: runuser -u ci -- env "PATH=${PATH}" invowk validate cst.invowkmod

      - name: Audit invowk module security
        run: |
          set -euo pipefail
          rc=0
          runuser -u ci -- env "PATH=${PATH}" invowk audit --format json --severity low cst.invowkmod > audit-report.json || rc=$?
          python3 .github/scripts/audit_summary.py audit-report.json "${rc}"
          exit "${rc}"

      - name: Upload invowk audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: invowk-audit-report
          path: audit-report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Run shell syntax and ShellCheck gate
        run: runuser -u ci -- env "PATH=${PATH}" invowk cmd test lint

      - name: Run unit tests
        run: runuser -u ci -- env "PATH=${PATH}" invowk cmd test unit

  e2e-tier1:
    name: E2E Tier 1 (Fedora 45 systemd + NAS)
    needs: [fast-gates, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup invowk
        uses: ./.github/actions/setup-invowk

      - name: Prepare E2E runner and hydrate image cache
        id: prep
        uses: ./.github/actions/prep-e2e-runner
        with:
          needs_btrfs: 'false'
          hydrate_images: 'systemd nas'
          tag_local: ${{ needs.changes.outputs.e2e_images != 'true' && 'true' || 'false' }}
          ghcr_token: ${{ github.token }}

      - name: Run E2E Tier 1
        env:
          REBUILD_IMAGES: ${{ needs.changes.outputs.e2e_images }}
          CST_E2E_BUILD_CACHE_FROM: ${{ steps.prep.outputs.cache_from }}
        run: |
          set -euo pipefail
          flags=(--keep_logs)
          if [[ "${REBUILD_IMAGES}" == "true" ]]; then
            flags+=(--rebuild)
          fi
          invowk cmd test e2e tier1 "${flags[@]}"

      - name: Upload Tier 1 logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-tier1-artifacts
          path: tests/e2e/.artifacts/
          if-no-files-found: ignore
          retention-days: 7

  e2e-tier2:
    name: E2E Tier 2 (Fedora 45 btrfs + cgroups)
    needs: [fast-gates, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup invowk
        uses: ./.github/actions/setup-invowk

      - name: Prepare E2E runner, btrfs kernel module, and image cache
        id: prep
        uses: ./.github/actions/prep-e2e-runner
        with:
          needs_btrfs: 'true'
          hydrate_images: 'systemd nas priv'
          tag_local: ${{ needs.changes.outputs.e2e_images != 'true' && 'true' || 'false' }}
          ghcr_token: ${{ github.token }}

      - name: Run E2E Tier 2
        env:
          # Tier 2 runs a --privileged container; run.py refuses it without this
          # opt-in, which only this disposable runner sets.
          CST_E2E_ALLOW_PRIVILEGED: '1'
          REBUILD_IMAGES: ${{ needs.changes.outputs.e2e_images }}
          CST_E2E_BUILD_CACHE_FROM: ${{ steps.prep.outputs.cache_from }}
        run: |
          set -euo pipefail
          flags=(--keep_logs)
          if [[ "${REBUILD_IMAGES}" == "true" ]]; then
            flags+=(--rebuild)
          fi
          invowk cmd test e2e tier2 "${flags[@]}"

      - name: Inspect host loop devices on failure
        if: failure()
        run: losetup -a || true

      - name: Upload Tier 2 logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-tier2-artifacts
          path: tests/e2e/.artifacts/
          if-no-files-found: ignore
          retention-days: 7

  ci-status:
    name: CI Status
    needs: [changes, fast-gates, e2e-tier1, e2e-tier2]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify all required CI gates succeeded or skipped cleanly
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          FAST_RESULT: ${{ needs.fast-gates.result }}
          TIER1_RESULT: ${{ needs.e2e-tier1.result }}
          TIER2_RESULT: ${{ needs.e2e-tier2.result }}
        run: |
          set -euo pipefail
          echo "changes=${CHANGES_RESULT} (code=${CODE_CHANGED:-<unset>}) fast-gates=${FAST_RESULT} e2e-tier1=${TIER1_RESULT} e2e-tier2=${TIER2_RESULT}"
          # The E2E tiers are skipped when 'changes' did not run cleanly, so a
          # failed or cancelled classification must never pass as "nothing to test".
          if [[ "${CHANGES_RESULT}" != "success" ]]; then
            echo "::error::changes (Classify Changes) did not succeed (${CHANGES_RESULT})" >&2
            exit 1
          fi
          if [[ "${FAST_RESULT}" != "success" ]]; then
            echo "::error::fast-gates did not succeed (${FAST_RESULT})" >&2
            exit 1
          fi
          for name_res in "e2e-tier1:${TIER1_RESULT}" "e2e-tier2:${TIER2_RESULT}"; do
            job="${name_res%%:*}"
            res="${name_res##*:}"
            if [[ "${res}" == "success" ]]; then
              continue
            fi
            # A skipped tier is only fine when the classification said there
            # was no code to test (for example a docs-only pull request).
            if [[ "${res}" == "skipped" && "${CODE_CHANGED}" == "false" ]]; then
              echo "${job} skipped: no code changes"
              continue
            fi
            echo "::error::${job} ended with non-passing result (${res}; code=${CODE_CHANGED:-<unset>})" >&2
            exit 1
          done
