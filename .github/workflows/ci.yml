# SPDX-License-Identifier: MPL-2.0
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      force_e2e:
        description: Force running both E2E tiers regardless of changed paths
        type: boolean
        required: false
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Classify Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      e2e_images: ${{ steps.filter.outputs.e2e_images }}
      quint: ${{ steps.filter.outputs.quint }}
    steps:
      - name: Checkout repository
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token stays out of .git/config: nothing after the checkout uses git
          # with it (zizmor's artipacked audit).
          persist-credentials: false
          fetch-depth: 0

      - name: Determine affected scope
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          FORCE_E2E: ${{ inputs.force_e2e || false }}
        run: |
          set -euo pipefail
          if [[ "${FORCE_E2E}" == "true" ]]; then
            echo "code=true" >> "${GITHUB_OUTPUT}"
            echo "e2e_images=false" >> "${GITHUB_OUTPUT}"
            echo "quint=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # The paths whose change the quint job checks with TLC: the module the
          # Quint spec models, the spec and its traces, the replay, the tool, and
          # what runs it (this workflow, the invowk task, the action that
          # installs invowk).
          quint_path() {
            case "$1" in
              btrfs/docker_volumes_nocow/*|btrfs/tests/quint/*|tests/quint/*|btrfs/tests/test_docker_volumes_nocow_replay.py) return 0 ;;
              .github/workflows/ci.yml|cst.invowkmod/invowkfile.cue|.github/actions/setup-invowk/*) return 0 ;;
              *) return 1 ;;
            esac
          }

          e2e_images="false"
          quint="false"
          if [[ "${EVENT_NAME}" == "push" ]]; then
            code="true"
            if [[ -n "${BEFORE_SHA}" && "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              mapfile -t changed < <(git diff --name-only "${BEFORE_SHA}..${AFTER_SHA}")
              for path in "${changed[@]}"; do
                case "${path}" in
                  tests/e2e/images/*|tests/e2e/scripts/*) e2e_images="true" ;;
                  *) ;;  # other paths leave the images alone
                esac
                if quint_path "${path}"; then
                  quint="true"
                fi
              done
            else
              e2e_images="true"
              quint="true"
            fi
            echo "code=${code}" >> "${GITHUB_OUTPUT}"
            echo "e2e_images=${e2e_images}" >> "${GITHUB_OUTPUT}"
            echo "quint=${quint}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            echo "code=true" >> "${GITHUB_OUTPUT}"
            echo "e2e_images=false" >> "${GITHUB_OUTPUT}"
            echo "quint=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          mapfile -t changed < <(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")
          if [[ "${#changed[@]}" -eq 0 ]]; then
            echo "code=false" >> "${GITHUB_OUTPUT}"
            echo "e2e_images=false" >> "${GITHUB_OUTPUT}"
            echo "quint=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          code="false"
          for path in "${changed[@]}"; do
            case "${path}" in
              tests/e2e/images/*|tests/e2e/scripts/*) e2e_images="true" ;;
              *) ;;  # other paths leave the images alone
            esac
            case "${path}" in
              *.md|LICENSE|.gitignore) ;;
              *) code="true" ;;
            esac
            if quint_path "${path}"; then
              quint="true"
            fi
          done

          echo "code=${code}" >> "${GITHUB_OUTPUT}"
          echo "e2e_images=${e2e_images}" >> "${GITHUB_OUTPUT}"
          echo "quint=${quint}" >> "${GITHUB_OUTPUT}"

  fast-gates:
    name: Fast Gates (Fedora 45)
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora:45
    timeout-minutes: 20  # the unit suite takes 6-9 min on a hosted runner; 10 cancelled a green run (#84)
    steps:
      - name: Install Fedora 45 fast-gate tools and create non-root CI user
        run: |
          set -euo pipefail
          # gettext-envsubst provides envsubst, needed by sigstore/cosign-installer inside setup-invowk.
          dnf -y install --setopt=install_weak_deps=False git-core python3 ShellCheck curl tar gzip findutils util-linux diffutils gettext-envsubst
          id -u ci >/dev/null 2>&1 || useradd -m -s /bin/bash ci

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The checkout belongs to root and the gates run as ci: without this, git
      # refuses to read it ("dubious ownership"), and the repository gate tests
      # (tests/repo_files.py, used by test_repo_paths, test_python_files and
      # test_subprocess_hygiene) fail because they cannot list its files.
      - name: Let the ci user's git read the checkout
        run: git config --system --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Setup invowk
        uses: ./.github/actions/setup-invowk

      # uv runs ruff and ty from the locked "dev" group (uv.lock, hashes checked).
      # The uv release and its archive SHA256 are pinned here; move both together
      # (the hash is in uv-x86_64-unknown-linux-gnu.tar.gz.sha256 of the release).
      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.0'
          checksum: 'eaf842262aa1c418d8ecc5605f02ee1ebfd369124fa48548e85f9481a47831a9'
          # No GitHub cache: two small wheels, and a cache dir under RUNNER_TEMP
          # would not be writable by the ci user.
          enable-cache: 'false'

      - name: Audit invowk module security (JSON report)
        # As root, like the summary step it replaces: the report goes into the
        # checkout and the summary into GITHUB_STEP_SUMMARY, which the ci user cannot write.
        run: invowk cmd ci audit

      - name: Upload invowk audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: invowk-audit-report
          path: audit-report.json
          if-no-files-found: ignore
          retention-days: 7

      # Every fast gate, the same task people and agents run: validate, audit,
      # test lint, test pylint, test types, test workflows, test unit (invowkfile.cue).
      - name: Run the fast gates (invowk cmd check)
        run: runuser -u ci -- env "PATH=${PATH}" invowk cmd check

      # The Hypothesis tests of tests/mbt (the mbt group of uv.lock), derandomized,
      # 100 examples per test: never fewer on a pull request (docs/dev-tools.md,
      # "Property and model-based tests"). tests/test_workflow_audit.py keeps this step.
      - name: Run the property and state-machine tests (invowk cmd test mbt, ci profile)
        run: runuser -u ci -- env "PATH=${PATH}" invowk cmd test mbt --profile ci

  e2e-tier1:
    name: E2E Tier 1 (Fedora 45 systemd + NAS, shard ${{ matrix.shard }}/3)
    needs: [fast-gates, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup invowk
        uses: ./.github/actions/setup-invowk

      - name: Prepare E2E runner and hydrate image cache
        id: prep
        uses: ./.github/actions/prep-e2e-runner
        with:
          needs_btrfs: 'false'
          hydrate_images: 'systemd nas'
          tag_local: ${{ needs.changes.outputs.e2e_images != 'true' && 'true' || 'false' }}
          ghcr_token: ${{ github.token }}

      - name: Run E2E Tier 1
        env:
          REBUILD_IMAGES: ${{ needs.changes.outputs.e2e_images }}
          CST_E2E_BUILD_CACHE_FROM: ${{ steps.prep.outputs.cache_from }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          flags=(--keep_logs --shard "${SHARD}/3")
          if [[ "${REBUILD_IMAGES}" == "true" ]]; then
            flags+=(--rebuild)
          fi
          invowk cmd test e2e tier1 "${flags[@]}"

      - name: Upload Tier 1 logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-tier1-shard-${{ matrix.shard }}-artifacts
          path: tests/e2e/.artifacts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  e2e-tier2:
    name: E2E Tier 2 (Fedora 45 btrfs + cgroups)
    needs: [fast-gates, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup invowk
        uses: ./.github/actions/setup-invowk

      - name: Prepare E2E runner, btrfs kernel module, and image cache
        id: prep
        uses: ./.github/actions/prep-e2e-runner
        with:
          needs_btrfs: 'true'
          hydrate_images: 'systemd nas priv'
          tag_local: ${{ needs.changes.outputs.e2e_images != 'true' && 'true' || 'false' }}
          ghcr_token: ${{ github.token }}

      - name: Run E2E Tier 2
        env:
          # Tier 2 runs a --privileged container; run.py refuses it without this
          # opt-in, which only this disposable runner sets.
          CST_E2E_ALLOW_PRIVILEGED: '1'
          REBUILD_IMAGES: ${{ needs.changes.outputs.e2e_images }}
          CST_E2E_BUILD_CACHE_FROM: ${{ steps.prep.outputs.cache_from }}
        run: |
          set -euo pipefail
          flags=(--keep_logs)
          if [[ "${REBUILD_IMAGES}" == "true" ]]; then
            flags+=(--rebuild)
          fi
          invowk cmd test e2e tier2 "${flags[@]}"

      - name: Inspect host loop devices on failure
        if: failure()
        run: losetup -a || true

      - name: Upload Tier 2 logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-tier2-artifacts
          path: tests/e2e/.artifacts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  # TLC on the Quint spec of docker-volumes-nocow (invowk cmd test quint: every
  # instance, every property), only when a change touches what it checks. The
  # replay of its traces is in the unit suite and runs in fast-gates always; this
  # job is what tells that a changed spec still holds its properties (a spec
  # and its traces changed together pass the replay whatever the spec says).
  # On the runner host, as its own non-root user, with the runner's JDK 21 and
  # node; the task fetches its pinned tools, each checked by its SHA-256 (no
  # GitHub cache). docs/dev-tools.md, "Model checking with Quint (optional)".
  quint:
    name: Quint Spec, TLC (docker-volumes-nocow)
    needs: [changes]
    if: needs.changes.outputs.quint == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup invowk
        uses: ./.github/actions/setup-invowk

      - name: Model-check the Quint specs (invowk cmd test quint)
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_21_X64}"
          export PATH="${JAVA_HOME}/bin:${PATH}"
          java -version
          node --version
          invowk cmd test quint

  ci-status:
    name: CI Status
    needs: [changes, fast-gates, e2e-tier1, e2e-tier2, quint]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify all required CI gates succeeded or skipped cleanly
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          QUINT_CHANGED: ${{ needs.changes.outputs.quint }}
          FAST_RESULT: ${{ needs.fast-gates.result }}
          TIER1_RESULT: ${{ needs.e2e-tier1.result }}
          TIER2_RESULT: ${{ needs.e2e-tier2.result }}
          QUINT_RESULT: ${{ needs.quint.result }}
        run: |
          set -euo pipefail
          echo "changes=${CHANGES_RESULT} (code=${CODE_CHANGED:-<unset>}) fast-gates=${FAST_RESULT} e2e-tier1=${TIER1_RESULT} e2e-tier2=${TIER2_RESULT} quint=${QUINT_RESULT} (quint=${QUINT_CHANGED:-<unset>})"
          # The E2E tiers are skipped when 'changes' did not run cleanly, so a
          # failed or cancelled classification must never pass as "nothing to test".
          if [[ "${CHANGES_RESULT}" != "success" ]]; then
            echo "::error::changes (Classify Changes) did not succeed (${CHANGES_RESULT})" >&2
            exit 1
          fi
          if [[ "${FAST_RESULT}" != "success" ]]; then
            echo "::error::fast-gates did not succeed (${FAST_RESULT})" >&2
            exit 1
          fi
          for name_res in "e2e-tier1:${TIER1_RESULT}" "e2e-tier2:${TIER2_RESULT}"; do
            job="${name_res%%:*}"
            res="${name_res##*:}"
            if [[ "${res}" == "success" ]]; then
              continue
            fi
            # A skipped tier is only fine when the classification said there
            # was no code to test (for example a docs-only pull request).
            if [[ "${res}" == "skipped" && "${CODE_CHANGED}" == "false" ]]; then
              echo "${job} skipped: no code changes"
              continue
            fi
            echo "::error::${job} ended with non-passing result (${res}; code=${CODE_CHANGED:-<unset>})" >&2
            exit 1
          done
          # The quint job is skipped only when no path it checks changed.
          if [[ "${QUINT_RESULT}" != "success" ]]; then
            if [[ "${QUINT_RESULT}" == "skipped" && "${QUINT_CHANGED}" == "false" ]]; then
              echo "quint skipped: no change to what the Quint spec checks"
            else
              echo "::error::quint ended with non-passing result (${QUINT_RESULT}; quint=${QUINT_CHANGED:-<unset>})" >&2
              exit 1
            fi
          fi
