# SPDX-License-Identifier: MPL-2.0
name: Nightly

on:
  schedule:
    - cron: '20 4 * * 1,4'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  static-gates:
    name: Validate, Audit, Lint & Unit (Fedora 45)
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora:45
    timeout-minutes: 15
    steps:
      - name: Install Fedora 45 tools and create non-root CI user
        run: |
          set -euo pipefail
          # gettext-envsubst provides envsubst, needed by sigstore/cosign-installer inside setup-invowk.
          dnf -y install --setopt=install_weak_deps=False git-core python3 ShellCheck curl tar gzip findutils util-linux diffutils gettext-envsubst
          id -u ci >/dev/null 2>&1 || useradd -m -s /bin/bash ci

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token stays out of .git/config: nothing after the checkout uses git
          # with it (zizmor's artipacked audit).
          persist-credentials: false

      # Same reason as in ci.yml: the checkout belongs to root, the gates run as ci.
      - name: Let the ci user's git read the checkout
        run: git config --system --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Setup invowk
        uses: ./.github/actions/setup-invowk

      # The same uv pin as ci.yml (version and archive SHA256); move both together.
      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.0'
          checksum: 'eaf842262aa1c418d8ecc5605f02ee1ebfd369124fa48548e85f9481a47831a9'
          enable-cache: 'false'

      - name: Audit invowk module security (JSON report)
        # As root, like the summary step it replaces: the report goes into the
        # checkout and the summary into GITHUB_STEP_SUMMARY, which the ci user cannot write.
        run: invowk cmd ci audit

      - name: Upload invowk audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-invowk-audit-report
          path: audit-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Run the fast gates (invowk cmd check)
        run: runuser -u ci -- env "PATH=${PATH}" invowk cmd check

  # The Hypothesis tests of tests/mbt with the nightly profile: random, 500
  # examples per test. The task prints the seed it chose, so a failure is
  # replayed with `invowk cmd test mbt --profile nightly --seed N`. A job of its
  # own: a red static-gates job does not hide it. tests/test_workflow_audit.py
  # keeps this step, in a job with no `if:`, `continue-on-error:` or `needs:`.
  mbt-nightly:
    name: Property and State-Machine Tests, Nightly Profile (Fedora 45)
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora:45
    timeout-minutes: 15
    steps:
      - name: Install Fedora 45 tools and create non-root CI user
        run: |
          set -euo pipefail
          # gettext-envsubst provides envsubst, needed by sigstore/cosign-installer inside setup-invowk.
          dnf -y install --setopt=install_weak_deps=False git-core python3 curl tar gzip findutils util-linux diffutils gettext-envsubst
          id -u ci >/dev/null 2>&1 || useradd -m -s /bin/bash ci

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same reason as in ci.yml: the checkout belongs to root, the tests run as ci.
      - name: Let the ci user's git read the checkout
        run: git config --system --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Setup invowk
        uses: ./.github/actions/setup-invowk

      # The same uv pin as ci.yml (version and archive SHA256); move both together.
      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.0'
          checksum: 'eaf842262aa1c418d8ecc5605f02ee1ebfd369124fa48548e85f9481a47831a9'
          enable-cache: 'false'

      - name: Run the property and state-machine tests (invowk cmd test mbt, nightly profile)
        run: runuser -u ci -- env "PATH=${PATH}" invowk cmd test mbt --profile nightly

  # Known vulnerabilities in the locked dev tools (uv.lock, every group). It
  # needs the network, so it runs here and not in the fast gates. A job of
  # its own: a new advisory or a vulnerability database that does not answer
  # fails this job only, and the static gates above still run.
  # tests/test_workflow_audit.py keeps it the last step of a job with no
  # `if:`, `continue-on-error:` or `needs:`. In the Fedora 45 image, like the gates:
  # pyproject.toml needs Python 3.15 from the system (no Python downloads),
  # which the runner host does not have. As root: it writes nothing.
  uv-audit:
    name: Audit the Locked Dev Tools (uv audit, Fedora 45)
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora:45
    timeout-minutes: 10
    steps:
      - name: Install Fedora 45 tools
        run: |
          set -euo pipefail
          # gettext-envsubst provides envsubst, needed by sigstore/cosign-installer inside setup-invowk.
          dnf -y install --setopt=install_weak_deps=False git-core python3 curl tar gzip findutils util-linux diffutils gettext-envsubst

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup invowk
        uses: ./.github/actions/setup-invowk

      # The same uv pin as ci.yml (version and archive SHA256); move both together.
      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.0'
          checksum: 'eaf842262aa1c418d8ecc5605f02ee1ebfd369124fa48548e85f9481a47831a9'
          enable-cache: 'false'

      - name: Audit the locked dev tools (uv audit)
        run: invowk cmd ci uv-audit

  # The unit suite under coverage.py: a second unit run (about 6 minutes), so
  # nightly only. Same image, tools and user as the fast gates, so the same
  # tests skip. Fails when a domain or application layer drops below its
  # floor (COVERAGE_FLOORS of tests/coverage_floors.py); the reports are an
  # artifact whether the floors hold or not. A failing unit test stops the
  # task before it writes any report (docs/dev-tools.md, "Coverage"): the
  # job's log shows that test, and there is no artifact.
  coverage:
    name: Unit Coverage and Floors (Fedora 45)
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora:45
    timeout-minutes: 25
    steps:
      - name: Install Fedora 45 tools and create non-root CI user
        run: |
          set -euo pipefail
          # gettext-envsubst provides envsubst, needed by sigstore/cosign-installer inside setup-invowk.
          dnf -y install --setopt=install_weak_deps=False git-core python3 ShellCheck curl tar gzip findutils util-linux diffutils gettext-envsubst
          id -u ci >/dev/null 2>&1 || useradd -m -s /bin/bash ci

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same reason as in ci.yml: the checkout belongs to root, the tests run as ci.
      - name: Let the ci user's git read the checkout
        run: git config --system --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Setup invowk
        uses: ./.github/actions/setup-invowk

      # The same uv pin as ci.yml (version and archive SHA256); move both together.
      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.0'
          checksum: 'eaf842262aa1c418d8ecc5605f02ee1ebfd369124fa48548e85f9481a47831a9'
          enable-cache: 'false'

      # The reports go outside the checkout, into a folder the ci user creates.
      - name: Run the unit suite under coverage.py and check the floors
        run: runuser -u ci -- env "PATH=${PATH}" invowk cmd test coverage --out /tmp/cst-coverage

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-coverage-report
          path: |
            /tmp/cst-coverage/
            !/tmp/cst-coverage/coverage.data
          if-no-files-found: ignore
          retention-days: 14

  # The E2E tiers need Docker, loop devices and the btrfs kernel module, so
  # they run on the Ubuntu host runner. Only the tiers run here; the static
  # gates above run in Fedora 45, like CI's fast-gates.
  clean-e2e-rebuild:
    name: Clean Fedora 45 E2E Rebuild
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup invowk
        uses: ./.github/actions/setup-invowk

      - name: Prepare E2E runner with host btrfs kernel support
        id: prep
        uses: ./.github/actions/prep-e2e-runner
        with:
          needs_btrfs: 'true'

      - name: Run E2E Tier 1 from a clean image build
        run: invowk cmd test e2e tier1 --rebuild --keep_logs

      - name: Run E2E Tier 2 from a clean image build
        # This runner starts with no E2E images and no build cache. Tier 1 just
        # built the systemd and NAS images with --rebuild, and the priv image
        # does not exist yet, so without --rebuild every tier 2 image is still
        # built from scratch in this job, and the shared ones are not built twice.
        # Tier 2 runs a --privileged container, so it needs the explicit opt-in.
        # It still runs when only tier 1 failed, but not when setup or the
        # runner preparation failed (prep runs after setup, so its outcome
        # covers both): there would be no invowk or no btrfs support.
        if: ${{ !cancelled() && steps.prep.outcome == 'success' }}
        env:
          CST_E2E_ALLOW_PRIVILEGED: '1'
        run: invowk cmd test e2e tier2 --keep_logs

      - name: Upload nightly E2E artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-e2e-artifacts
          path: tests/e2e/.artifacts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
