# SPDX-License-Identifier: MPL-2.0
# Developer tools for this repository only: the ruff linter, the ty type
# checker and the zizmor workflow audit (and, in their own groups, the
# cosmic-ray mutation tester and coverage.py). CST
# itself is not a Python package and installs nothing from here: its helpers
# run on the system's /usr/bin/python3 with the standard library only.
# See docs/dev-tools.md for the pinned versions, where the tools' virtual
# environment lives (outside the checkout) and how to upgrade a pin.

[project]
name = "cst-dev"
version = "0"
# The oldest Python CST runs on: Fedora 45 ships 3.15 (CI, E2E images, the
# workstation host). ruff and ty both take their target Python version from
# this lower bound; neither sets its own.
requires-python = ">=3.15"

[dependency-groups]
dev = ["ruff==0.17.5", "ty==0.0.104", "zizmor==1.32.0"]
mutation = ["cosmic-ray==8.9.0"]
coverage = ["coverage==7.17.3"]

[tool.uv]
package = false
required-version = ">=0.12.0"
# Use the system Python (the one the helpers run on); never download one.
python-preference = "only-system"
python-downloads = "never"

# ---- ruff -------------------------------------------------------------------

[tool.ruff]
# The exact ruff of the dev group: any other ruff (an editor's, one on PATH)
# that reads this file refuses to run instead of linting or formatting by
# other rules. Change it together with the pin above (tests/test_python_files.py
# fails when the two differ).
required-version = "==0.17.5"
# The line length `ruff format` aims for (its check runs in
# `invowk cmd test pylint`). Long strings and comments can stay longer: the
# linter's line-length rule (E501) is not selected.
line-length = 120
# ruff finds *.py files by itself but not the extensionless helpers: each one
# is named here. tests/test_python_files.py fails when a Python file of the
# repository is missing from this list.
extend-include = [
    "bluetooth/bt-helper",
    "bluetooth/bt-ldac-watch",
    "bluetooth/bt-setup",
    "btrfs/btrfs-bulk",
    "btrfs/btrfs-compress",
    "btrfs/btrfs-health-check",
    "btrfs/btrfs-snapshot-core",
    "btrfs/btrfs-snapshot-runtime",
    "btrfs/btrfs-stall-monitord",
    "btrfs/btrfs-stall-report",
    "btrfs/chrome-cache",
    "btrfs/cst-pending-alerts",
    "btrfs/docker-gc",
    "btrfs/docker-volumes-nocow",
    "cpu/cpu-setup",
    "cpu/cpu-watch",
    "cpu/game-profile",
    "cpu/vm-pin",
    "doctor/cst-doctor",
    "perf/cst-perf",
    "tests/mutation/cst-mutation",
    "toolchains/cst-toolchains",
    "vm/cst-vm",
]

[tool.ruff.format]
# Leave the Python code blocks in Markdown files alone (ruff would format
# them too). They are short examples wrapped to read well next to the text
# around them, not code that runs; the format check is for the code.
exclude = ["*.md"]

[tool.ruff.lint]
# F: pyflakes (unused names, undefined names); B: bugbear (likely bugs);
# UP: pyupgrade (older syntax); E9: syntax errors. The type annotation rules
# (ANN) are not here: `invowk cmd test types` runs them on their own
# (`ruff check --select ANN`), on every Python file. No per-file-ignores
# entry may ignore ANN (tests/test_python_files.py fails on one).
# PLW1510: every subprocess.run says check=True or check=False. Whether a
# failed command stops the program is a decision, not a default.
# With no hit to fix when they were turned on: PGH (no blanket `# type:
# ignore` or `# noqa`), A (no builtin name shadowed), T10 (no debugger call
# left), TID (no relative import from a parent package), LOG and G (logging
# calls: no f-string or % formatting in the message), PLE (pylint errors),
# W (pycodestyle warnings: trailing whitespace, invalid escapes), C4
# (comprehensions: no list() around a generator, no needless dict()).
# Turned on together (2026-11), each family's few hits fixed first: E7
# (statements: no lambda bound to a name, no variable named l), PLC and PLR
# (pylint conventions and refactors; the size rules are budgeted, below),
# S (bandit: no os.system, shell=True, exec, mktemp, ...), TRY (exception
# handling), ISC (implicit string joins: inside a list or a tuple a join
# needs parentheses, so a missing comma between two lines is an error), ARG
# (unused arguments, production code only: see per-file-ignores), SLOT
# (__slots__ on str/tuple subclasses), YTT (sys.version checks), FLY (a
# join of constants instead of an f-string), RSE (raise X, not X()), ASYNC,
# INT (gettext), INP (a Python file outside a package), COM818 and COM819
# (a stray trailing comma that makes a tuple, a comma where none belongs).
# Lint group 2, once their last hits were fixed (2026-11): DTZ (naive
# datetimes), PLW (pylint warnings), RUF (ruff's own rules), SIM
# (simplifications), PERF (performance), FURB (refurb), PIE, RET (returns),
# PYI (typing), EXE (a shebang on a file that is not executable, or the
# reverse) and ERA (commented-out code).
select = [
    "F",
    "B",
    "UP",
    "E9",
    "PLW1510",
    "PGH",
    "A",
    "T10",
    "TID",
    "LOG",
    "G",
    "PLE",
    "W",
    "C4",
    "E7",
    "PLC",
    "PLR",
    "S",
    "TRY",
    "ISC",
    "ARG",
    "SLOT",
    "YTT",
    "FLY",
    "RSE",
    "ASYNC",
    "INT",
    "INP",
    "COM818",
    "COM819",
    "DTZ",
    "PLW",
    "RUF",
    "SIM",
    "PERF",
    "FURB",
    "PIE",
    "RET",
    "PYI",
    "EXE",
    "ERA",
    # Preview rules, each by its full code (see preview below): a loop that
    # changes the list it iterates (B909), a return value in a generator,
    # silently dropped (B901), a dict iterated without .items() (PLE1141), a
    # set changed while it is iterated (PLE4703), a misspelled dunder method
    # (PLW3201), __slots__ redefined in a subclass (PLW0244), a tuple in a
    # subscript with parentheses (RUF031), a regex pattern that is not a raw
    # string (RUF039), a dataclass field that is a class variable by accident
    # (RUF045), d.get(k, False) in a boolean test (RUF056), a property that
    # returns nothing (RUF066), a finally that does nothing (RUF072), a
    # context manager whose __enter__ can fail after acquiring (RUF075).
    "B901",
    "B909",
    "PLE1141",
    "PLE4703",
    "PLW3201",
    "PLW0244",
    "RUF031",
    "RUF039",
    "RUF045",
    "RUF056",
    "RUF066",
    "RUF072",
    "RUF075",
]
# Preview rules are on only where select names them by their full code: with
# explicit-preview-rules, a family selector (PLC, RUF, ...) does not pull in
# the other preview rules of its family. Never PLC1901 (it asks for `not x`
# instead of `x == ""`, the opposite of the house style). The formatter
# stays on its stable style ([tool.ruff.format] has no preview).
# tests/test_python_files.py checks all three. A ruff upgrade can change or
# drop a preview rule: read its findings (docs/dev-tools.md, "Upgrading a pin").
preview = true
explicit-preview-rules = true
# RUF001-RUF003 (a character that looks like another): the micro sign of the
# microsecond unit (µs) in cpu's docstrings is meant.
allowed-confusables = ["µ"]
# Rules of the selected families left out, each with its reason. No entry
# may name ANN or ALL (tests/test_python_files.py).
ignore = [
    # Counted per package by tests/ruff_budget.py (RUFF_BUDGETS), a budget
    # never above its entry: too many returns, branches, arguments,
    # statements, positional arguments; a number compared with a literal
    # (.agents/rules/magic-values.md).
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    "PLR2004",
    # Every command runs through cst_core's runner with an argument list and
    # a bare program name, found on PATH on purpose (S603: subprocess call,
    # S607: partial path). TRY003 (a long message passed to an exception):
    # the messages are the programs' output.
    "S603",
    "S607",
    "TRY003",
    # assert: type narrowing (assert proc.stdout is not None); the helpers
    # never run with -O.
    "S101",
    # XML parsing: the XML is libvirt's own (virsh dumpxml); the fix would be
    # a third-party package (defusedxml), which CST cannot use.
    "S314",
    # chmod 0o755/0o711: the intended modes of folders and scripts.
    "S103",
    # A /tmp literal: /tmp/chrome-cache is the feature, TMPDIR=/tmp for sccache.
    "S108",
    # os.exec*: the wiring modules re-run the program through sudo on purpose.
    "S606",
    # urlopen of a fixed https URL (.github/scripts/pin_invowk.py downloads a release).
    "S310",
    # Style only, no safer code: a return in a try's else (TRY300), a raise
    # inside a try (TRY301); TRY004 asks for TypeError where the code raises
    # its own error on purpose (a behaviour change with no gain).
    "TRY300",
    "TRY301",
    "TRY004",
    # An import inside a function: cst_core/wiring.py imports a module's
    # code only when its command runs, on purpose.
    "PLC0415",
    # A `# noqa` that suppresses nothing: the noqa comments name budgeted
    # rules (BLE001), which a plain `ruff check` does not select, so it
    # would report every one. tests/ruff_budget.py's second run checks it
    # with the budgeted rules turned on.
    "RUF100",
]
# CST uses the standard library only: no rule may suggest or write an import
# from the third-party typing_extensions (tests/test_python_files.py checks
# this is false).
typing-extensions = false

[tool.ruff.lint.per-file-ignores]
# Fakes and stubs in tests take arguments they do not use, and tests may use
# the random module and md5/sha1 (not for security): ARG, S311 and S324 apply
# to production code only (tests/ at the top or inside a module, as
# tests/budgets.py's is_test_file).
"tests/**" = ["ARG", "S311", "S324"]
"**/tests/**" = ["ARG", "S311", "S324"]
# The E2E suites are loaded by path (tests/e2e/run.py), not imported: an
# __init__.py there would make unittest discovery import them.
"tests/e2e/suites/*.py" = ["INP001"]
# S105 (a hard-coded password) reads names, not secrets: the PASS result
# word of the health check, the NAS_PASSWORD settings key.
"btrfs/health_check/domain.py" = ["S105"]
"btrfs/snapshot_runtime/domain.py" = ["S105"]
# Naive datetimes on purpose. docker-gc's day(), recorded_line and
# last_run_line: fromtimestamp(t, UTC).astimezone() differs from
# fromtimestamp(t) within a day of years 1 and 9999 (it raises there). cpu:
# the run folder name is the local wall clock written on disk (a round trip
# through an aware time risks a DST fold), and an aware isoformat would add
# +HH:MM to the printed result. A snapshot name is local wall clock by its
# format (strptime without %z), and the snapshot core's tests build such
# names the same way.
"btrfs/docker_gc/domain.py" = ["DTZ006", "SIM905"]
"cpu/domain.py" = ["DTZ006"]
"btrfs/snapshot/domain.py" = ["DTZ007"]
"btrfs/tests/test_btrfs_snapshot_core.py" = ["DTZ001", "DTZ007"]
# SIM905 (above): docker-gc's Docker name lists are a triple-quoted word list
# split at run time on purpose (about 200 words; a list literal would be
# about 200 lines).
# PERF401: events is the _EventLog list whose overridden append also passes
# each event to the CLI as it happens; list.extend would bypass it and the
# lines would stop printing live.
"swap/application/apply.py" = ["PERF401"]
# SIM115 (open without a with): the NAS run's tee file is held open for the
# whole run on purpose; the unit runner's sys.stdin is open(0, closefd=False)
# for the rest of the run.
"btrfs/snapshot_runtime/adapters/nas.py" = ["SIM115"]
"tests/run_unit.py" = ["SIM115"]
# PLW1509 (preexec_fn in a program with threads): the runner only passes a
# caller's preexec_fn through (no production caller passes one today); the
# NAS test's controlling_tty does setsid + TIOCSCTTY so the backup sees
# SIGHUP when the terminal closes, which no Popen option does.
"cst_core/adapters/runner.py" = ["PLW1509"]
"vm/tests/test_vm_nas.py" = ["PLW1509"]

[tool.ruff.lint.mccabe]
# For C901, which is not selected above: tests/ruff_budget.py counts the
# functions over this complexity per package, a budget never above its entry.
max-complexity = 15

# ---- coverage.py --------------------------------------------------------------

[tool.coverage.run]
# `invowk cmd test coverage` (the nightly): the unit suite under coverage.py,
# statements and branches, production code only. tests/coverage_floors.py
# then checks COVERAGE_FLOORS. See docs/dev-tools.md, "Coverage".
branch = true
source = ["."]
omit = ["tests/*", "*/tests/*"]

# ---- ty ---------------------------------------------------------------------

[tool.ty.environment]
# CST runs on Linux only. ty's default is the platform it runs on, so the
# same code could pass here and fail elsewhere (os.geteuid, os.killpg "may
# be missing"). tests/test_python_files.py accepts only "linux".
python-platform = "linux"

[tool.ty.terminal]
error-on-warning = true

[tool.ty.rules]
# Every rule is an error (all), also those that are warnings or off by
# default: missing-type-argument, redundant-condition-strict and the others,
# and each rule a newer ty adds. The rules named below are raised by all too;
# they stay named for what their comments say about each one.
# tests/test_python_files.py accepts a rule (or all) here only when it is
# raised to "error": lowering one ("warn", "ignore") would take diagnostics
# out of the gate.
all = "error"
deprecated = "error"
division-by-zero = "error"
possibly-missing-attribute = "error"
possibly-missing-import = "error"
possibly-unresolved-reference = "error"
# A `# type: ignore` or `# ty: ignore` that suppresses nothing, and a cast()
# to the type the value already has.
unused-ignore-comment = "error"
redundant-cast = "error"
# A boolean test (if x, not x, x and y in a condition) on a value typed
# X | None where X also has a falsy value ("", 0, False, an empty
# container): it cannot tell None from that value. Write which one is
# meant: is not None / is None, or the form equal by type (d.get(k, False),
# os.environ.get(X, ""), x is not None and x != "" / != 0 / len(x) > 0).
# It does not see value forms (x or DEFAULT, x and y as a value), bool(x)
# or Any: see docs/dev-tools.md.
truthiness-test-of-none-union = "error"
# A method that overrides one of a base class says so with @override
# (typing.override), unittest's setUp included.
missing-override-decorator = "error"
# A value typed Any (json.loads, a regex group, sys.stdout, struct.unpack) returned as, or assigned
# to, a narrower declared type. Both rules: return alone is bypassed by an annotated local.
unsound-return = "error"
unsound-assignment = "error"

[tool.ty.src]
# The ty gate: every Python file of the repository, by folder. ty finds the
# *.py files below a folder by itself, but not the extensionless helpers:
# each one is named, as in [tool.ruff] extend-include. ty leaves out a file
# a git ignore rule or an .ignore file matches, even a tracked or named one.
# tests/test_python_files.py fails when a Python file of the repository is
# under no folder here (or, for a helper, not named), on a tracked Python
# file a git ignore rule matches, on an .ignore file, and on an entry that
# is not a folder or a Python file of the repository.
include = [
    ".github/scripts",
    "bluetooth",
    "btrfs",
    "cpu",
    "cst_core",
    "doctor",
    "perf",
    "swap",
    "tests",
    "toolchains",
    "vm",
    "bluetooth/bt-helper",
    "bluetooth/bt-ldac-watch",
    "bluetooth/bt-setup",
    "btrfs/btrfs-bulk",
    "btrfs/btrfs-compress",
    "btrfs/btrfs-health-check",
    "btrfs/btrfs-snapshot-core",
    "btrfs/btrfs-snapshot-runtime",
    "btrfs/btrfs-stall-monitord",
    "btrfs/btrfs-stall-report",
    "btrfs/chrome-cache",
    "btrfs/cst-pending-alerts",
    "btrfs/docker-gc",
    "btrfs/docker-volumes-nocow",
    "cpu/cpu-setup",
    "cpu/cpu-watch",
    "cpu/game-profile",
    "cpu/vm-pin",
    "doctor/cst-doctor",
    "perf/cst-perf",
    "tests/mutation/cst-mutation",
    "toolchains/cst-toolchains",
    "vm/cst-vm",
]
