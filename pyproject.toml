# SPDX-License-Identifier: MPL-2.0
# Developer tools for this repository only: the ruff linter, the ty type
# checker and the zizmor workflow audit (and, in their own groups, the
# cosmic-ray mutation tester and coverage.py). CST
# itself is not a Python package and installs nothing from here: its helpers
# run on the system's /usr/bin/python3 with the standard library only.
# See docs/dev-tools.md for the pinned versions, where the tools' virtual
# environment lives (outside the checkout) and how to upgrade a pin.

[project]
name = "cst-dev"
version = "0"
# The oldest Python CST runs on: Fedora 45 ships 3.15 (CI, E2E images, the
# workstation host). ruff and ty both take their target Python version from
# this lower bound; neither sets its own.
requires-python = ">=3.15"

[dependency-groups]
dev = ["ruff==0.17.5", "ty==0.0.104", "zizmor==1.32.0"]
mutation = ["cosmic-ray==8.9.0"]
coverage = ["coverage==7.17.3"]

[tool.uv]
package = false
required-version = ">=0.12.0"
# Use the system Python (the one the helpers run on); never download one.
python-preference = "only-system"
python-downloads = "never"

# ---- ruff -------------------------------------------------------------------

[tool.ruff]
# The exact ruff of the dev group: any other ruff (an editor's, one on PATH)
# that reads this file refuses to run instead of linting or formatting by
# other rules. Change it together with the pin above (tests/test_python_files.py
# fails when the two differ).
required-version = "==0.17.5"
# The line length `ruff format` aims for (its check runs in
# `invowk cmd test pylint`). Long strings and comments can stay longer: the
# linter's line-length rule (E501) is not selected.
line-length = 120
# ruff finds *.py files by itself but not the extensionless helpers: each one
# is named here. tests/test_python_files.py fails when a Python file of the
# repository is missing from this list.
extend-include = [
    "bluetooth/bt-helper",
    "bluetooth/bt-ldac-watch",
    "bluetooth/bt-setup",
    "btrfs/btrfs-bulk",
    "btrfs/btrfs-health-check",
    "btrfs/btrfs-snapshot-core",
    "btrfs/btrfs-stall-monitord",
    "btrfs/btrfs-stall-report",
    "btrfs/chrome-cache",
    "btrfs/cst-pending-alerts",
    "btrfs/docker-gc",
    "btrfs/docker-volumes-nocow",
    "cpu/cpu-setup",
    "cpu/cpu-watch",
    "cpu/game-profile",
    "cpu/vm-pin",
    "doctor/cst-doctor",
    "tests/mutation/cst-mutation",
    "toolchains/cst-toolchains",
    "vm/cst-vm",
]

[tool.ruff.format]
# Leave the Python code blocks in Markdown files alone (ruff would format
# them too). They are short examples wrapped to read well next to the text
# around them, not code that runs; the format check is for the code.
exclude = ["*.md"]

[tool.ruff.lint]
# F: pyflakes (unused names, undefined names); B: bugbear (likely bugs);
# UP: pyupgrade (older syntax); E9: syntax errors. The type annotation rules
# (ANN) are not here: `invowk cmd test types` runs them on their own
# (`ruff check --select ANN`), on every Python file. No per-file-ignores
# entry may ignore ANN (tests/test_python_files.py fails on one).
# PLW1510: every subprocess.run says check=True or check=False. Whether a
# failed command stops the program is a decision, not a default.
select = ["F", "B", "UP", "E9", "PLW1510"]

[tool.ruff.lint.mccabe]
# For C901, which is not selected above: tests/ruff_budget.py counts the
# functions over this complexity per package, a budget never above its entry.
max-complexity = 15

# ---- coverage.py --------------------------------------------------------------

[tool.coverage.run]
# `invowk cmd test coverage` (the nightly): the unit suite under coverage.py,
# statements and branches, production code only. tests/coverage_floors.py
# then checks COVERAGE_FLOORS. See docs/dev-tools.md, "Coverage".
branch = true
source = ["."]
omit = ["tests/*", "*/tests/*"]

# ---- ty ---------------------------------------------------------------------

[tool.ty.terminal]
error-on-warning = true

[tool.ty.rules]
# Rules raised to errors (by default some are warnings, some are off).
# tests/test_python_files.py accepts a rule here only when it is raised to
# "error": lowering one ("warn", "ignore") would take diagnostics out of the
# gate.
deprecated = "error"
division-by-zero = "error"
possibly-missing-attribute = "error"
possibly-missing-import = "error"
possibly-unresolved-reference = "error"

[tool.ty.src]
# The ty gate: every Python file of the repository, by folder. ty finds the
# *.py files below a folder by itself (git-ignored files are left out), but
# not the extensionless helpers: each one is named, as in [tool.ruff]
# extend-include. tests/test_python_files.py fails when a Python file of the
# repository is under no folder here (or, for a helper, not named), and on
# an entry that is not a folder or a Python file of the repository.
include = [
    ".github/scripts",
    "bluetooth",
    "btrfs",
    "cpu",
    "cst_core",
    "doctor",
    "swap",
    "tests",
    "toolchains",
    "vm",
    "bluetooth/bt-helper",
    "bluetooth/bt-ldac-watch",
    "bluetooth/bt-setup",
    "btrfs/btrfs-bulk",
    "btrfs/btrfs-health-check",
    "btrfs/btrfs-snapshot-core",
    "btrfs/btrfs-stall-monitord",
    "btrfs/btrfs-stall-report",
    "btrfs/chrome-cache",
    "btrfs/cst-pending-alerts",
    "btrfs/docker-gc",
    "btrfs/docker-volumes-nocow",
    "cpu/cpu-setup",
    "cpu/cpu-watch",
    "cpu/game-profile",
    "cpu/vm-pin",
    "doctor/cst-doctor",
    "tests/mutation/cst-mutation",
    "toolchains/cst-toolchains",
    "vm/cst-vm",
]
