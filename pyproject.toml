# Developer tools for this repository only: the ruff linter and the ty type
# checker (and, in their own group, the cosmic-ray mutation tester). CST
# itself is not a Python package and installs nothing from here: its helpers
# run on the system's /usr/bin/python3 with the standard library only.
# See docs/dev-tools.md for the pinned versions, where the tools' virtual
# environment lives (outside the checkout) and how to upgrade a pin.

[project]
name = "cst-dev"
version = "0"
# The oldest Python CST runs on: Fedora 45 ships 3.15 (CI, E2E images, the
# workstation host). ruff and ty both take their target Python version from
# this lower bound; neither sets its own.
requires-python = ">=3.15"

[dependency-groups]
dev = ["ruff==0.17.5", "ty==0.0.104"]
mutation = ["cosmic-ray==8.9.0"]

[tool.uv]
package = false
required-version = ">=0.12.0"
# Use the system Python (the one the helpers run on); never download one.
python-preference = "only-system"
python-downloads = "never"

# ---- ruff -------------------------------------------------------------------

[tool.ruff]
# The line length `ruff format` aims for (its check runs in
# `invowk cmd test pylint`). Long strings and comments can stay longer: the
# linter's line-length rule (E501) is not selected.
line-length = 120
# ruff finds *.py files by itself but not the extensionless helpers: each one
# is named here. tests/test_python_files.py fails when a Python file of the
# repository is missing from this list.
extend-include = [
    "bluetooth/bt-helper",
    "bluetooth/bt-ldac-watch",
    "btrfs/btrfs-bulk",
    "btrfs/btrfs-snapshot-core",
    "btrfs/btrfs-stall-monitord",
    "btrfs/btrfs-stall-report",
    "btrfs/chrome-cache",
    "btrfs/docker-gc",
    "btrfs/docker-volumes-nocow",
    "cpu/cpu-watch",
    "cpu/vm-pin",
    "doctor/cst-doctor",
    "tests/mutation/cst-mutation",
    "toolchains/cst-toolchains",
    "vm/cst-vm",
]

[tool.ruff.format]
# Leave the Python code blocks in Markdown files alone (ruff would format
# them too). They are short examples wrapped to read well next to the text
# around them, not code that runs; the format check is for the code.
exclude = ["*.md"]

[tool.ruff.lint]
# F: pyflakes (unused names, undefined names); B: bugbear (likely bugs);
# UP: pyupgrade (older syntax); E9: syntax errors. The type annotation rules
# (ANN) are not here: `invowk cmd test types` runs them on their own
# (`ruff check --select ANN`), only for the typed modules (see
# per-file-ignores below).
# PLW1510: every subprocess.run says check=True or check=False. Whether a
# failed command stops the program is a decision, not a default.
select = ["F", "B", "UP", "E9", "PLW1510"]

[tool.ruff.lint.per-file-ignores]
# The typed modules: every function annotated. ANN (selected by
# `ruff check --select ANN` in `invowk cmd test types`) is ignored everywhere
# except the files in the braces; add a module here once it is fully typed
# (and ty-clean, see [tool.ty.src] below).
"!{.github/scripts/audit_summary.py,.github/scripts/pin_invowk.py,bluetooth/__init__.py,bluetooth/adapters.py,bluetooth/bt-helper,bluetooth/bt-ldac-watch,bluetooth/cli.py,bluetooth/domain.py,bluetooth/ldac_watch.py,bluetooth/ports.py,bluetooth/tests/__init__.py,bluetooth/tests/test_bluetooth.py,bluetooth/tests/test_ldac_watch.py,btrfs/__init__.py,btrfs/adapters.py,btrfs/application.py,btrfs/btrfs-bulk,btrfs/btrfs-snapshot-core,btrfs/btrfs-stall-monitord,btrfs/btrfs-stall-report,btrfs/chrome-cache,btrfs/docker-gc,btrfs/docker-volumes-nocow,btrfs/domain.py,btrfs/ports.py,btrfs/snapshot/__init__.py,btrfs/snapshot/adapters.py,btrfs/snapshot/cli.py,btrfs/snapshot/domain.py,btrfs/tests/__init__.py,btrfs/tests/test_btrfs_bulk.py,btrfs/tests/test_btrfs_snapshot_core.py,btrfs/tests/test_btrfs_steam.py,btrfs/tests/test_chrome_cache.py,btrfs/tests/test_cst_link.py,btrfs/tests/test_docker_volumes_nocow.py,btrfs/tests/test_health_check.py,btrfs/tests/test_snapshot_runtime.py,btrfs/tests/test_stall_monitord.py,btrfs/tests/test_stall_report.py,cpu/__init__.py,cpu/adapters.py,cpu/cli.py,cpu/cpu-watch,cpu/domain.py,cpu/tests/__init__.py,cpu/tests/test_cpu.py,cpu/vm-pin,cst_core/__init__.py,cst_core/adapters/__init__.py,cst_core/adapters/files.py,cst_core/adapters/install.py,cst_core/adapters/journal.py,cst_core/adapters/locks.py,cst_core/adapters/nocow.py,cst_core/adapters/runtime.py,cst_core/adapters/zipapp.py,cst_core/application/__init__.py,cst_core/application/install.py,cst_core/cli.py,cst_core/domain/__init__.py,cst_core/domain/dispatch.py,cst_core/domain/errors.py,cst_core/domain/files.py,cst_core/domain/imports.py,cst_core/domain/install.py,cst_core/domain/plan.py,cst_core/domain/text.py,cst_core/domain/units.py,cst_core/domain/values.py,cst_core/installer.py,cst_core/ports/__init__.py,doctor/__init__.py,doctor/adapters.py,doctor/application.py,doctor/cli.py,doctor/cst-doctor,doctor/domain.py,doctor/ports.py,doctor/presenter.py,doctor/tests/__init__.py,doctor/tests/test_doct