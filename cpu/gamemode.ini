; Managed by cpu-setup.sh (CST). GameMode only triggers the game profile
; (cpu-game.service) and disables the split-lock penalty while a game runs.
; It changes no governor (intel_pstate EPP is set per core type by the profile),
; no nice/ioprio (cgroup weights do it), no pinning/parking (Source 2 pins its
; own P- and E-core threads).
[general]
desiredgov=powersave
defaultgov=powersave
softrealtime=off
renice=0
ioprio=off
inhibit_screensaver=1
disable_splitlock=1

[cpu]
park_cores=no
pin_cores=no

[gpu]
apply_gpu_optimisations=0

[custom]
start=systemctl start --no-block cpu-game.service
end=systemctl stop --no-block cpu-game.service
script_timeout=10
