# Managed by cpu-setup.sh (CST): the VM never ties with the desktop.
# The name starts with 10- so that it is read before the 50-<Property>.conf
# files of `systemctl set-property` (the game profile): systemd reads drop-ins
# in file-name order, and the last one read wins.
[Slice]
CPUWeight=50
IOWeight=50
