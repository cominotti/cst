# Settings of `cst bluetooth` (bluetooth-setup.sh, CST): KEY=value, '#' starts a comment.
# These are the defaults that come with CST. To change them for your user,
# put the lines you want to change into ~/.config/cst/bluetooth.conf (same
# format; it wins over this file). Command line options win over both.

# The headset: its Bluetooth address (bluetoothctl devices). Default: JBL Live Beam 4.
DEVICE=38:D5:18:CD:AA:4C

# LDAC quality over A2DP: auto (adaptive, 990/660/330 kbps) | hq (990) | sq (660) | mq (330).
LDAC_QUALITY=auto

# Preferred transport for connections the PC starts: le | bredr | last-used.
# Empty = leave the headset's setting alone.
BEARER=

# LE Audio in PipeWire: off (the default) | on. Off = PipeWire offers BlueZ
# only the classic roles (A2DP, HFP), for ALL devices: dual-mode headsets such
# as the Beam 4 play over A2DP/LDAC and HFP; LE-only devices get no audio.
# Why off: LE stereo to true-wireless earbuds does not work on this Intel BE200
# yet (upstream BlueZ is working on it), and the Beam 4 fell into a disconnect
# loop on LE. Turn it on: `cst bluetooth le-audio on` (writes LE_AUDIO=on into
# ~/.config/cst/bluetooth.conf, then runs apply, which restarts WirePlumber);
# `cst bluetooth le-audio off` turns it off again. See README.md, "LE Audio: off by default".
LE_AUDIO=off

# LDAC sample rate watcher: empty = off (the default) | 48000 = on. When the
# headset reconnects by itself it often sets up LDAC at 96000 Hz; with 48000,
# `cst bluetooth apply` installs a small user service (cst-bt-ldac48.service)
# that switches the headset to SBC and back once (twice at most per
# connection), so the PC sets the stream up again at 48000 Hz. See README.md, "LDAC sample rate".
# Keep it off until it is checked again on PipeWire 1.6.11: on 2026-11-11 its
# profile switch failed there ("a2dp-sink-sbc did not become active within 6 s").
LDAC_RATE=
